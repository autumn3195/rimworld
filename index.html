    function advanceOneDay() {
      let d = parseInt(document.getElementById('logDay').value) || 1;
      let s = document.getElementById('logSeason').value;
      let y = parseInt(document.getElementById('logYear').value) || 5500;

      const seasons = ["1분기", "2분기", "3분기", "4분기"];
      d++;
      if (d > 15) {
        d = 1;
        let sIdx = seasons.indexOf(s);
        if (sIdx === 3 || sIdx === -1) {
          s = "1분기";
          y++;
        } else {
          s = seasons[sIdx + 1];
        }
      }

      document.getElementById('logDay').value = d;
      document.getElementById('logSeason').value = s;
      document.getElementById('logYear').value = y;
      appData.currentLogDate = { year: y, season: s, day: d };
      saveData();
    }


    /* ===== 연대기 / 소설 관리 ===== */
    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function setLogSelection(id, checked) {
      if (checked) selectedLogIds.add(id);
      else selectedLogIds.delete(id);
    }

    function toggleAllLogSelection(checked) {
      selectedLogIds.clear();
      if (checked) appData.logs.forEach(log => selectedLogIds.add(log.id));
      renderLogList();
    }

    function getNextEpisodePosition() {
      if (!appData.chronicle.length) return { chapter: 1, episode: 1 };
      const sorted = [...appData.chronicle].sort((a,b) => (a.chapter-b.chapter) || (a.episode-b.episode));
      const last = sorted[sorted.length - 1];
      const chapter = Number(last.chapter) || 1;
      const maxEpisode = Math.max(...appData.chronicle.filter(x => (Number(x.chapter)||1) === chapter).map(x => Number(x.episode)||1));
      return { chapter, episode: maxEpisode + 1 };
    }

    function cloneLogSnapshot(log) {
      return {
        id: log.id,
        year: log.year,
        season: log.season,
        day: log.day,
        dateStr: log.dateStr || `${log.year}년 ${log.season} ${log.day}일`,
        text: log.text,
        timestamp: log.timestamp
      };
    }

    function renderExistingEpisodeTargetOptions() {
      const select = document.getElementById('existingEpisodeTarget');
      if (!select) return;
      const previous = select.value;
      const sorted = [...appData.chronicle].sort((a,b) =>
        (Number(a.chapter)-Number(b.chapter)) ||
        (Number(a.episode)-Number(b.episode)) ||
        ((a.createdAt||0)-(b.createdAt||0))
      );
      select.innerHTML = '<option value="">기존 화 선택</option>' + sorted.map(ep => {
        const chapter = Number(ep.chapter) || 1;
        const episode = Number(ep.episode) || 1;
        const title = ep.title ? ` · ${escapeHtml(ep.title)}` : '';
        return `<option value="${escapeHtml(ep.id)}">${chapter}장 ${episode}화${title}</option>`;
      }).join('');
      if (sorted.some(ep => ep.id === previous)) select.value = previous;
      select.disabled = sorted.length === 0;
    }

    function getChronicleLogIdentity(log) {
      if (log && log.id) return `id:${log.id}`;
      return `legacy:${log?.year || ''}|${log?.season || ''}|${log?.day || ''}|${log?.text || ''}`;
    }

    function addSelectedLogsToExistingEpisode() {
      const picked = appData.logs.filter(log => selectedLogIds.has(log.id));
      if (!picked.length) {
        alert('기존 화에 추가할 로그를 먼저 선택해주세요.');
        return;
      }

      const select = document.getElementById('existingEpisodeTarget');
      const targetId = select ? select.value : '';
      if (!targetId) {
        alert('로그를 추가할 기존 화를 선택해주세요.');
        return;
      }

      const target = appData.chronicle.find(ep => ep.id === targetId);
      if (!target) {
        alert('선택한 화를 찾을 수 없습니다.');
        renderExistingEpisodeTargetOptions();
        return;
      }

      if (!Array.isArray(target.sourceLogs)) target.sourceLogs = [];
      const existingKeys = new Set(target.sourceLogs.map(getChronicleLogIdentity));
      const snapshots = picked.map(cloneLogSnapshot);
      const toAdd = snapshots.filter(log => !existingKeys.has(getChronicleLogIdentity(log)));
      const duplicateCount = snapshots.length - toAdd.length;

      if (!toAdd.length) {
        alert('선택한 로그가 이미 해당 화에 모두 저장되어 있습니다.');
        return;
      }

      target.sourceLogs.push(...toAdd);
      target.updatedAt = Date.now();
      saveData();
      selectedLogIds.clear();
      renderLogList();
      renderChronicleList();
      if (selectedChronicleEpisodeId === target.id) loadChronicleEpisode(target.id);

      const label = `${Number(target.chapter)||1}장 ${Number(target.episode)||1}화`;
      const duplicateNote = duplicateCount ? ` (중복 ${duplicateCount}건 제외)` : '';
      showToast(`${label}에 원본 로그 ${toAdd.length}건을 추가했습니다.${duplicateNote}`);
    }

    function createEpisodeFromSelectedLogs() {
      const picked = appData.logs.filter(log => selectedLogIds.has(log.id));
      if (!picked.length) {
        alert('새 화로 저장할 로그를 먼저 선택해주세요.');
        return;
      }
      const pos = getNextEpisodePosition();
      const now = Date.now();
      const episode = {
        id: 'episode_' + now,
        chapter: pos.chapter,
        episode: pos.episode,
        title: '',
        sourceLogs: picked.map(cloneLogSnapshot),
        novelText: '',
        createdAt: now,
        updatedAt: now
      };
      appData.chronicle.push(episode);
      saveData();
      selectedLogIds.clear();
      selectedChronicleEpisodeId = episode.id;
      loadChronicleEpisode(episode.id);
      renderLogList();
      renderChronicleList();
      updateBadges();
      switchTab('chronicle');
      showToast(`${episode.chapter}장 ${episode.episode}화에 원본 로그 ${picked.length}건을 저장했습니다.`);
    }

    function createBlankEpisode() {
      const pos = getNextEpisodePosition();
      selectedChronicleEpisodeId = null;
      chronicleDraftSourceLogs = [];
      editingChronicleSourceLogIndex = null;
      document.getElementById('chronicleEpisodeId').value = '';
      document.getElementById('chronicleChapter').value = pos.chapter;
      document.getElementById('chronicleEpisode').value = pos.episode;
      document.getElementById('chronicleTitle').value = '';
      document.getElementById('chronicleNovelText').value = '';
      document.getElementById('chronicleEditorHeading').innerText = '새 화 작성';
      document.getElementById('btnDeleteEpisode').style.display = 'none';
      renderChronicleSourceLogs([]);
      renderChronicleList();
    }

    function resetChronicleEditor() {
      if (appData.chronicle.length) {
        const sorted = [...appData.chronicle].sort((a,b) => (a.chapter-b.chapter) || (a.episode-b.episode));
        loadChronicleEpisode(sorted[0].id);
      } else {
        createBlankEpisode();
      }
    }

    function loadChronicleEpisode(id) {
      const ep = appData.chronicle.find(x => x.id === id);
      if (!ep) return;
      selectedChronicleEpisodeId = id;
      chronicleDraftSourceLogs = Array.isArray(ep.sourceLogs) ? ep.sourceLogs.map(x => ({...x})) : [];
      editingChronicleSourceLogIndex = null;
      document.getElementById('chronicleEpisodeId').value = ep.id;
      document.getElementById('chronicleChapter').value = Number(ep.chapter) || 1;
      document.getElementById('chronicleEpisode').value = Number(ep.episode) || 1;
      document.getElementById('chronicleTitle').value = ep.title || '';
      document.getElementById('chronicleNovelText').value = ep.novelText || '';
      document.getElementById('chronicleEditorHeading').innerText = `${Number(ep.chapter)||1}장 ${Number(ep.episode)||1}화 편집`;
      document.getElementById('btnDeleteEpisode').style.display = '';
      renderChronicleSourceLogs(chronicleDraftSourceLogs);
      renderChronicleList();
    }

    let chronicleSourceExpanded = true;

    function toggleChronicleSourceLogs(forceState) {
      const container = document.getElementById('chronicleSourceList');
      const button = document.getElementById('chronicleSourceToggle');
      if (!container || !button) return;

      chronicleSourceExpanded = typeof forceState === 'boolean' ? forceState : !chronicleSourceExpanded;
      container.classList.toggle('collapsed', !chronicleSourceExpanded);
      button.innerText = chronicleSourceExpanded ? '▲ 접기' : '▼ 펼치기';
    }

    let editingChronicleSourceLogIndex = null;

    function persistChronicleDraftSourceLogs() {
      const id = document.getElementById('chronicleEpisodeId').value;
      if (!id) return;
      const ep = appData.chronicle.find(x => x.id === id);
      if (!ep) return;
      ep.sourceLogs = chronicleDraftSourceLogs.map(x => ({...x}));
      ep.updatedAt = Date.now();
      saveData();
    }

    function startEditChronicleSourceLog(index) {
      if (!chronicleDraftSourceLogs[index]) return;
      editingChronicleSourceLogIndex = index;
      renderChronicleSourceLogs(chronicleDraftSourceLogs);
    }

    function cancelEditChronicleSourceLog() {
      editingChronicleSourceLogIndex = null;
      renderChronicleSourceLogs(chronicleDraftSourceLogs);
    }

    function saveEditedChronicleSourceLog(index) {
      const log = chronicleDraftSourceLogs[index];
      if (!log) return;
      const year = parseInt(document.getElementById(`chronicleSourceYear_${index}`).value) || log.year || 5500;
      const season = document.getElementById(`chronicleSourceSeason_${index}`).value.trim() || log.season || '1분기';
      const day = Math.max(1, parseInt(document.getElementById(`chronicleSourceDay_${index}`).value) || log.day || 1);
      const text = document.getElementById(`chronicleSourceText_${index}`).value.trim();
      if (!text) {
        alert('로그 내용을 입력해주세요.');
        return;
      }
      log.year = year;
      log.season = season;
      log.day = day;
      log.dateStr = `${year}년 ${season} ${day}일`;
      log.text = text;
      editingChronicleSourceLogIndex = null;
      persistChronicleDraftSourceLogs();
      renderChronicleSourceLogs(chronicleDraftSourceLogs);
      showToast('이 화에 보관된 원본 로그를 수정했습니다.');
    }

    function deleteChronicleSourceLog(index) {
      const log = chronicleDraftSourceLogs[index];
      if (!log) return;
      const label = log.dateStr || `${log.year}년 ${log.season} ${log.day}일`;
      if (!confirm(`${label} 원본 로그를 이 화에서 삭제하시겠습니까?\n일지 탭의 원본 로그에는 영향을 주지 않습니다.`)) return;
      chronicleDraftSourceLogs.splice(index, 1);
      if (editingChronicleSourceLogIndex === index) editingChronicleSourceLogIndex = null;
      else if (editingChronicleSourceLogIndex !== null && editingChronicleSourceLogIndex > index) editingChronicleSourceLogIndex--;
      persistChronicleDraftSourceLogs();
      renderChronicleSourceLogs(chronicleDraftSourceLogs);
      showToast('이 화에 보관된 원본 로그를 삭제했습니다.');
    }

    function renderChronicleSourceLogs(logs) {
      const container = document.getElementById('chronicleSourceList');
      const count = document.getElementById('chronicleSourceCount');
      if (!container || !count) return;
      count.innerText = `${logs.length}건`;
      if (!logs.length) {
        container.innerHTML = '<div class="chronicle-empty">이 화에 저장된 원본 로그가 없습니다.</div>';
        toggleChronicleSourceLogs(true);
        return;
      }
      container.innerHTML = logs.map((log, index) => {
        if (editingChronicleSourceLogIndex === index) {
          return `
            <div class="chronicle-source-log ${getSeasonClass(log.season)}">
              <div class="chronicle-source-edit-grid">
                <input type="number" id="chronicleSourceYear_${index}" value="${escapeHtml(log.year ?? '')}" placeholder="연도">
                <input type="text" id="chronicleSourceSeason_${index}" value="${escapeHtml(log.season ?? '')}" placeholder="분기">
                <input type="number" id="chronicleSourceDay_${index}" min="1" value="${escapeHtml(log.day ?? '')}" placeholder="일">
              </div>
              <textarea id="chronicleSourceText_${index}" class="chronicle-source-edit-text">${escapeHtml(log.text)}</textarea>
              <div class="chronicle-source-edit-actions">
                <button type="button" class="btn-secondary" onclick="cancelEditChronicleSourceLog()">취소</button>
                <button type="button" class="btn-primary" onclick="saveEditedChronicleSourceLog(${index})">수정 저장</button>
              </div>
            </div>`;
        }
        return `
          <div class="chronicle-source-log ${getSeasonClass(log.season)}">
            <div class="chronicle-source-top">
              <div class="chronicle-source-date">📅 ${escapeHtml(log.dateStr || `${log.year}년 ${log.season} ${log.day}일`)}</div>
              <div class="chronicle-source-actions">
                <button type="button" class="chronicle-source-action" onclick="startEditChronicleSourceLog(${index})">✏ 편집</button>
                <button type="button" class="chronicle-source-action delete" onclick="deleteChronicleSourceLog(${index})">× 삭제</button>
              </div>
            </div>
            <div class="chronicle-source-text">${escapeHtml(log.text)}</div>
          </div>`;
      }).join('');
      toggleChronicleSourceLogs(chronicleSourceExpanded);
    }

    function saveChronicleEpisode() {
      const chapter = Math.max(1, parseInt(document.getElementById('chronicleChapter').value) || 1);
      const episodeNo = Math.max(1, parseInt(document.getElementById('chronicleEpisode').value) || 1);
      const title = document.getElementById('chronicleTitle').value.trim();
      const novelText = document.getElementById('chronicleNovelText').value;
      const id = document.getElementById('chronicleEpisodeId').value;

      const duplicate = appData.chronicle.find(x => x.id !== id && (Number(x.chapter)||1) === chapter && (Number(x.episode)||1) === episodeNo);
      if (duplicate && !confirm(`${chapter}장 ${episodeNo}화가 이미 있습니다. 그래도 같은 번호로 저장하시겠습니까?`)) return;

      if (id) {
        const ep = appData.chronicle.find(x => x.id === id);
        if (!ep) return;
        ep.chapter = chapter;
        ep.episode = episodeNo;
        ep.title = title;
        ep.novelText = novelText;
        ep.sourceLogs = chronicleDraftSourceLogs.map(x => ({...x}));
        ep.updatedAt = Date.now();
        selectedChronicleEpisodeId = ep.id;
      } else {
        const now = Date.now();
        const ep = {
          id: 'episode_' + now,
          chapter,
          episode: episodeNo,
          title,
          sourceLogs: chronicleDraftSourceLogs.map(x => ({...x})),
          novelText,
          createdAt: now,
          updatedAt: now
        };
        appData.chronicle.push(ep);
        selectedChronicleEpisodeId = ep.id;
        document.getElementById('chronicleEpisodeId').value = ep.id;
        document.getElementById('btnDeleteEpisode').style.display = '';
      }
      saveData();
      renderChronicleList();
      updateBadges();
      document.getElementById('chronicleEditorHeading').innerText = `${chapter}장 ${episodeNo}화 편집`;
      showToast(`${chapter}장 ${episodeNo}화가 저장되었습니다.`);
    }

    function deleteCurrentEpisode() {
      const id = document.getElementById('chronicleEpisodeId').value;
      if (!id) return;
      const ep = appData.chronicle.find(x => x.id === id);
      if (!ep) return;
      if (!confirm(`${ep.chapter}장 ${ep.episode}화를 삭제하시겠습니까?\n이 화에 보관된 원본 로그 스냅샷과 소설 본문도 함께 삭제됩니다.`)) return;
      appData.chronicle = appData.chronicle.filter(x => x.id !== id);
      selectedChronicleEpisodeId = null;
      saveData();
      renderChronicleList();
      resetChronicleEditor();
      updateBadges();
      showToast('화가 삭제되었습니다.');
    }

    function getChapterMeta(chapter) {
      const key = String(Number(chapter) || 1);
      if (!appData.chapterMeta) appData.chapterMeta = {};
      if (!appData.chapterMeta[key]) appData.chapterMeta[key] = { name: '', collapsed: false };
      if (typeof appData.chapterMeta[key].name !== 'string') appData.chapterMeta[key].name = '';
      if (typeof appData.chapterMeta[key].collapsed !== 'boolean') appData.chapterMeta[key].collapsed = false;
      return appData.chapterMeta[key];
    }

    function editChronicleChapterName(chapter) {
      const meta = getChapterMeta(chapter);
      const next = prompt(`제${chapter}장의 이름을 입력하세요.\n비워두면 장 이름을 제거합니다.`, meta.name || '');
      if (next === null) return;
      meta.name = next.trim();
      saveData();
      renderChronicleList();
      showToast(meta.name ? `제${chapter}장 이름을 수정했습니다.` : `제${chapter}장 이름을 제거했습니다.`);
    }

    function toggleChronicleChapter(chapter) {
      const meta = getChapterMeta(chapter);
      meta.collapsed = !meta.collapsed;
      saveData();
      renderChronicleList();
    }

    function renderChronicleList() {
      renderExistingEpisodeTargetOptions();
      const container = document.getElementById('chronicleEpisodeList');
      const count = document.getElementById('chronicleSidebarCount');
      if (!container || !count) return;
      count.innerText = appData.chronicle.length;
      if (!appData.chronicle.length) {
        container.innerHTML = '<div class="chronicle-empty">아직 저장된 화가 없습니다.<br>일지에서 로그를 선택해 새 화로 저장해보세요.</div>';
        return;
      }
      const sorted = [...appData.chronicle].sort((a,b) => (Number(a.chapter)-Number(b.chapter)) || (Number(a.episode)-Number(b.episode)) || ((a.createdAt||0)-(b.createdAt||0)));
      const groups = {};
      sorted.forEach(ep => {
        const ch = Number(ep.chapter) || 1;
        if (!groups[ch]) groups[ch] = [];
        groups[ch].push(ep);
      });
      container.innerHTML = Object.keys(groups).sort((a,b)=>Number(a)-Number(b)).map(ch => {
        const meta = getChapterMeta(ch);
        const chapterName = meta.name ? ` · ${escapeHtml(meta.name)}` : '';
        return `
        <div class="chronicle-chapter">
          <div class="chronicle-chapter-title">
            <div class="chronicle-chapter-label">제${escapeHtml(ch)}장${chapterName}</div>
            <div class="chronicle-chapter-actions">
              <button type="button" class="chronicle-chapter-action" onclick="editChronicleChapterName(${Number(ch)})">✏ 이름 편집</button>
              <button type="button" class="chronicle-chapter-action" onclick="toggleChronicleChapter(${Number(ch)})">${meta.collapsed ? '▼ 펼치기' : '▲ 접기'}</button>
            </div>
          </div>
          <div class="chronicle-chapter-episodes ${meta.collapsed ? 'collapsed' : ''}">
            ${groups[ch].map(ep => `
              <div class="chronicle-episode-item ${ep.id === selectedChronicleEpisodeId ? 'selected' : ''}" onclick="loadChronicleEpisode('${ep.id}')">
                <div class="chronicle-episode-no">${escapeHtml(ch)}장 ${escapeHtml(ep.episode)}화 · 원본 로그 ${(ep.sourceLogs||[]).length}건</div>
                <div class="chronicle-episode-title">${escapeHtml(ep.title || '제목 없음')}</div>
              </div>
            `).join('')}
          </div>
        </div>`;
      }).join('');
    }

    function copyChronicleSourceLogs() {
      const logs = chronicleDraftSourceLogs || [];
      if (!logs.length) { alert('복사할 원본 로그가 없습니다.'); return; }
      const text = logs.map(l => `[${l.dateStr || `${l.year}년 ${l.season} ${l.day}일`}] ${l.text}`).join('\n');
      navigator.clipboard.writeText(text).then(() => showToast('이 화의 원본 로그를 복사했습니다.'));
    }

    function copyChronicleNovel() {
      const text = document.getElementById('chronicleNovelText').value.trim();
      if (!text) { alert('복사할 소설 본문이 없습니다.'); return; }
      navigator.clipboard.writeText(text).then(() => showToast('소설 본문을 복사했습니다.'));
    }

    /* 누적 일지 로그만 순수하게 전체 복사 */
    function copyRawLogsOnly() {
      if (appData.logs.length === 0) {
        alert("복사할 누적 일지가 없습니다.");
        return;
      }

      sortLogsChronologically();
      let logText = "";
      appData.logs.forEach(l => {
        logText += `[${l.dateStr}] ${l.text}\n`;
      });

      navigator.clipboard.writeText(logText.trim()).then(() => {
        showToast("누적 일지 전체가 클립보드에 복사되었습니다!");
      }).catch(() => {
        const dummy = document.createElement("textarea");
        document.body.appendChild(dummy);
        dummy.value = logText.trim();
        dummy.select();
        document.execCommand("copy");
        document.body.removeChild(dummy);
        showToast("누적 일지 전체가 클립보드에 복사되었습니다!");
      });
    }

    function updateBadges() {
      document.getElementById('pawn-count-badge').innerText = appData.pawns.length;
      document.getElementById('log-count-badge').innerText = appData.logs.length;
      const chronicleBadge = document.getElementById('chronicle-count-badge');
      if (chronicleBadge) chronicleBadge.innerText = appData.chronicle.length;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.className = "show";
      setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 2200);
    }

    /* JSON 백업 & 복구 */
    function exportData() {
      const json = JSON.stringify(appData, null, 2);
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `RimWorld_Chronicle_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (parsed && (parsed.pawns || parsed.logs)) {
            appData = parsed;
            saveData();
            init();
            showToast("데이터 복구가 완료되었습니다!");
          } else {
            alert("올바른 백업 파일 형식이 아닙니다.");
          }
        } catch (err) {
          alert("파일 파싱 실패: " + err.message);
        }
      };
      reader.readAsText(file);
    }

    window.onload = init;
  </script>
</body>
</html>
